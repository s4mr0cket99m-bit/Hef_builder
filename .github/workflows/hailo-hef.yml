# GitHub Actions workflow to compile a Hailo HEF from an ONNX model using Hailo Dataflow Compiler (bypassing Docker-based Model Zoo) [oai_citation:0‡community.hailo.ai](https://community.hailo.ai/t/need-help-for-voluntary-project-convert-onnx-to-hef/15703#:~:text=For%20custom%20ONNX%20models%2C%20I%E2%80%99d,the%20workflow%20I%E2%80%99ve%20been%20using).
name: Hailo HEF Compilation

on:
  push:
    branches: [ main ]   # Run on pushes to main (adjust as needed)
  workflow_dispatch: {}  # Allow manual trigger

jobs:
  compile-hef:
    runs-on: ubuntu-latest
    steps:
      # Use Hailo Dataflow Compiler CLI (parse → optimize → compile) instead of Hailo Docker images [oai_citation:1‡community.hailo.ai](https://community.hailo.ai/t/need-help-for-voluntary-project-convert-onnx-to-hef/15703#:~:text=For%20custom%20ONNX%20models%2C%20I%E2%80%99d,the%20workflow%20I%E2%80%99ve%20been%20using)
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Download Hailo Dataflow Compiler wheel
        # Download DFC v3.33.0 (.whl) from latest release tagged "dfc-1"
        run: curl -L "https://github.com/${{ github.repository }}/releases/download/dfc-1/hailo_dataflow_compiler-3.33.0-py3-none-linux_x86_64.whl" -o hailo_dataflow_compiler-3.33.0-py3-none-linux_x86_64.whl
        # Note: Keep original filename to avoid pip's "wrong number of parts: 'dfc'" error

      - name: Install Hailo Dataflow Compiler
        run: pip install hailo_dataflow_compiler-3.33.0-py3-none-linux_x86_64.whl
        # The DFC is provided as a Python wheel to install into the environment [oai_citation:2‡community.hailo.ai](https://community.hailo.ai/t/how-to-install-dataflow-compiler/1276#:~:text=But%20to%20answer%20your%20question%2C,put%20into%20your%20python%20env)

      - name: Parse ONNX model to HAR
        run: hailo parser onnx --model your_model.onnx --output model.har
        # Parse the ONNX model into a Hailo Archive (.har) using the DFC CLI [oai_citation:3‡community.hailo.ai](https://community.hailo.ai/t/need-help-for-voluntary-project-convert-onnx-to-hef/15703#:~:text=Step%201%3A%20Parse%20ONNX%20to,HAR)

      - name: Optimize (quantize) HAR
        run: hailo optimize --har model.har --output model_quantized.har --use-random-calib-set
        # Quantize the HAR to INT8 (use random data for calibration in CI) [oai_citation:4‡community.hailo.ai](https://community.hailo.ai/t/convert-onxx-to-hef-using-the-cli/9106#:~:text=I%20was%20already%20able%20to,I%20used%20were%20the%20following) [oai_citation:5‡community.hailo.ai](https://community.hailo.ai/t/need-help-for-voluntary-project-convert-onnx-to-hef/15703#:~:text=hailo%20optimize%20model_v1.har%20%5C%20,performance)

      - name: Compile HAR to HEF
        run: hailo compiler --har model_quantized.har --hw-arch hailo8l --output model.hef
        # Compile the quantized HAR to a Hailo Executable File (.hef) for the target device [oai_citation:6‡community.hailo.ai](https://community.hailo.ai/t/need-help-for-voluntary-project-convert-onnx-to-hef/15703#:~:text=hailo%20compiler%20model_v1_quantized.har%20%5C%20,hailo8l)

      - name: Upload HEF artifact
        uses: actions/upload-artifact@v3
        with:
          name: compiled-hef
          path: model.hef
