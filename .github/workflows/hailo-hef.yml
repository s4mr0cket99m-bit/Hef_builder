name: Hailo DistilGPT2 Compilation

on:
  workflow_dispatch:

jobs:
  compile_model:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8 (recommended for DFC)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # --- Fix for your error: pygraphviz needs Graphviz headers (cgraph.h) ---
      - name: Install system build deps (graphviz headers, toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            graphviz libgraphviz-dev pkg-config build-essential

      - name: Install Python deps (Torch, Transformers, ONNX, NumPy)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.0.1 transformers==4.33.0 onnx numpy

      - name: Download and convert DistilGPT2 to ONNX (seq len 128)
        run: |
          python - << 'EOF'
          import torch
          from transformers import AutoModelForCausalLM
          model = AutoModelForCausalLM.from_pretrained("distilgpt2")
          model.eval()
          dummy_input = torch.randint(0, 50257, (1, 128), dtype=torch.long)
          torch.onnx.export(
              model,
              dummy_input,
              "distilgpt2.onnx",
              input_names=["input_ids"],
              output_names=["logits"],
              opset_version=13,   # stable for most transformer ops
              dynamic_axes=None
          )
          EOF

      - name: Generate synthetic calibration data
        run: |
          python - << 'EOF'
          import numpy as np
          # 10 samples x 128 tokens; values in [0, 50256]
          calib = np.random.randint(0, 50257, size=(10, 128), dtype=np.int32)
          np.save("calib_set.npy", calib)
          EOF

      - name: Install Hailo Dataflow Compiler 3.33.0
        run: |
          pip install \
            https://github.com/s4mr0cket99m-bit/Hef_builder/releases/download/dfc-1/hailo_dataflow_compiler-3.33.0-py3-none-linux_x86_64.whl

      # Parse → Optimize → Compile (target: Hailo-8)
      - name: Parse ONNX to HAR
        run: |
          hailo parser onnx distilgpt2.onnx --hw-arch hailo8 --har-path distilgpt2.har

      - name: Optimize / Quantize with calibration
        run: |
          hailo optimize distilgpt2.har --calib-set-path calib_set.npy --output-har-path distilgpt2_optimized.har

      - name: Compile HAR to HEF
        run: |
          hailo compile distilgpt2_optimized.har --output-dir .
          # Ensure predictable name:
          HEF=$(ls -1 *.hef | head -n 1)
          mv "$HEF" distilgpt2.hef

      - name: Upload HEF artifact
        uses: actions/upload-artifact@v4
        with:
          name: distilgpt2-hef
          path: distilgpt2.hef
