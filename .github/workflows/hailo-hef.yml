name: Build Hailo HEF (MiniLM Reranker) — direct wheel

on:
  workflow_dispatch:
    inputs:
      wheel_url:
        description: "Direct URL to the Hailo Dataflow Compiler wheel"
        required: true
        default: "https://github.com/s4mr0cket99m-bit/Hef_builder/releases/download/v1/hailo_dataflow_compiler-3.33.0-py3-none-linux_x86_64.whl"
      model_url:
        description: "ONNX model URL to compile"
        required: true
        default: "https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/main/onnx/model.onnx?download=true"

jobs:
  build-hef:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"  # 3.11 can be used too

    - name: Install Python & system deps
      run: |
        python -m pip install --upgrade pip wheel
        python -m pip install onnx numpy
        sudo apt-get update
        sudo apt-get install -y graphviz libgraphviz-dev pkg-config python3-dev

    # Download your DFC wheel (don’t rename; keep server filename).
    - name: Download & install Hailo DFC wheel
      env:
        WHEEL_URL: ${{ github.event.inputs.wheel_url }}
        GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        mkdir -p vendor
        cd vendor
        # -L follow redirects, -J keep server filename, -O write to file
        curl -fL -J -O -H "Authorization: Bearer ${GH_TOKEN}" "$WHEEL_URL"
        ls -l
        python -m pip install ./*.whl

    # Download the ONNX model
    - name: Download ONNX
      env:
        MODEL_URL: ${{ github.event.inputs.model_url }}
      run: |
        set -e
        mkdir -p onnx
        curl -fL -o onnx/model.onnx "$MODEL_URL"
        ls -lh onnx/model.onnx

    # Determine input names and generate --input-sizes parameters
    - name: Generate input sizes
      id: inputsizes
      run: |
        python - <<'PY'
        import onnx, json, os
        model = onnx.load("onnx/model.onnx")
        # Collect input names that are not initializers
        init_names = {init.name for init in model.graph.initializer}
        names = []
        for inp in model.graph.input:
          if inp.name not in init_names:
            names.append(inp.name)
        # Build flags for static shape [1,128] for each input
        sizes_str = ",".join(f"{n}=1x128" for n in names)
        print("sizes=" + sizes_str)
        # Expose for later steps
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
          f.write(f"sizes={sizes_str}\n")
        PY

    # Parse with static shapes
    - name: Parse ONNX -> HAR
      run: |
        set -e
        SIZES="${{ steps.inputsizes.outputs.sizes }}"
        echo "Using input sizes: $SIZES"
        hailo parser onnx onnx/model.onnx \
          --input-sizes "$SIZES" \
          --har-path build/parsed.har \
          --hw-arch hailo8

    # Prepare dummy calibration NPZ (64 samples of shape [1,128] int32)
    - name: Create calibration set
      run: |
        python - <<'PY'
        import numpy as np, os
        os.makedirs("build", exist_ok=True)
        arr = [np.random.randint(0, 30000, size=(1,128), dtype=np.int32) for _ in range(64)]
        np.savez("build/calib_set.npz", *arr)
        PY

    # Quantize/optimize
    - name: Optimize model (quantize)
      run: |
        set -e
        hailo optimize build/parsed.har \
          --calib-set-path build/calib_set.npz \
          --hw-arch hailo8 \
          --har-path build/quantized.har

    # Compile to HEF using Python API
    - name: Compile HAR to HEF
      run: |
        set -e
        python - <<'PY'
        from hailo_sdk_client import ClientRunner
        r = ClientRunner(har="build/quantized.har")
        hef = r.compile()
        with open("reranker.hef","wb") as f:
          f.write(hef)
        print("HEF generated:", len(hef), "bytes")
        PY

    # Upload the resulting HEF
    - name: Upload HEF
      uses: actions/upload-artifact@v4
      with:
        name: hailo-hef
        path: reranker.hef
