name: Build Hailo HEF (MiniLM Reranker)

on:
  workflow_dispatch: {}  # allow manual trigger from Actions tab

jobs:
  build-hef:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
      # We need datasets for the calibration set and onnx for input/output detection
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==2.*" onnx

      - name: Prepare workspace directories
        run: |
          mkdir -p onnx calib

      - name: Download ONNX model (Xenova/ms-marco-MiniLM-L-6-v2)
        run: |
          curl -L -o onnx/model.onnx \
            "https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/main/onnx/model.onnx?download=true"
          ls -lh onnx/model.onnx

      - name: Create tiny calibration set (200 AG News samples)
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          import os
          from datasets import load_dataset
          os.makedirs("calib", exist_ok=True)
          # Use AG News for a small calibration set (avoids heavy IRDS dependencies)
          ds = load_dataset("ag_news", split="train[:200]")
          for i, ex in enumerate(ds):
              text = ex["text"].replace("\n", " ")[:1000]
              with open(f"calib/sample_{i:04d}.txt", "w") as f:
                  f.write(text)
          print("Calibration folder ready:", len(os.listdir("calib")), "files")
          PY

      - name: Write Hailo YAML configuration
        run: |
          cat > zoo.yaml <<'YML'
          model:
            path: /w/onnx/model.onnx
          parser:
            nodes: []         # Let the tool infer input/output names
          preprocessing:
            network_type: generic
          quantization:
            calib_set: /w/calib
            images_dir: /w/calib
          hnp:
            target: hailo8
          postprocessing:
            network_type: generic
          YML
          cat zoo.yaml

      - name: Pull Hailo Model Zoo Docker image
        run: docker pull hailoai/hailo-model-zoo:latest

      - name: Quantize and compile (first attempt)
        id: compile1
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/w hailoai/hailo-model-zoo:latest \
            /bin/bash -lc '
              set -e
              cd /w
              echo "[1/2] Quantizing..."
              hailo_model_zoo.py quantize --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml
              echo "[2/2] Compiling..."
              hailo_model_zoo.py compile --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml --hw-arch hailo8
              ls -1 *.hef || true
            '

      - name: Auto-detect IO names and retry (if needed)
        if: steps.compile1.outcome == 'failure'
        run: |
          python - <<'PY'
          import onnx
          m = onnx.load("onnx/model.onnx")
          inputs = [i.name for i in m.graph.input]
          outputs = [o.name for o in m.graph.output]
          with open("zoo.yaml", "w") as f:
              f.write("model:\n  path: /w/onnx/model.onnx\n")
              f.write("parser:\n  nodes:\n")
              for name in inputs:
                  f.write(f"    - input: {name}\n")
              for name in outputs:
                  f.write(f"    - output: {name}\n")
              f.write("preprocessing:\n  network_type: generic\n")
              f.write("quantization:\n  calib_set: /w/calib\n  images_dir: /w/calib\n")
              f.write("hnp:\n  target: hailo8\n")
              f.write("postprocessing:\n  network_type: generic\n")
          print("Patched zoo.yaml with explicit IO names:", inputs, outputs)
          PY
          cat zoo.yaml
          docker run --rm -v "$GITHUB_WORKSPACE":/w hailoai/hailo-model-zoo:latest \
            /bin/bash -lc '
              set -e
              cd /w
              echo "[Retry] Quantizing..."
              hailo_model_zoo.py quantize --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml
              echo "[Retry] Compiling..."
              hailo_model_zoo.py compile --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml --hw-arch hailo8
              ls -1 *.hef || true
            '

      - name: Collect HEF file
        run: |
          HEF="$(ls -1 *.hef | head -n1 || true)"
          if [ -z "$HEF" ]; then
            echo "No .hef was produced. Check the logs and model compatibility."
            exit 1
          fi
          cp "$HEF" reranker.hef

      - name: Upload compiled HEF
        uses: actions/upload-artifact@v4
        with:
          name: hailo-hef
          path: reranker.hef
