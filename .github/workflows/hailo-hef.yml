name: Build Hailo HEF (MiniLM Reranker) — direct URL

on:
  workflow_dispatch:
    inputs:
      wheel_url:
        description: "Direct URL to the Hailo Dataflow Compiler wheel"
        required: true
        default: "https://github.com/s4mr0cket99m-bit/Hef_builder/releases/download/v1/hailo_dataflow_compiler-3.33.0-py3-none-linux_x86_64.whl"
      model_url:
        description: "ONNX model URL to compile"
        required: true
        default: "https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/main/onnx/model.onnx?download=true"

jobs:
  build-hef:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnx numpy

      # --- download and install your Hailo DFC wheel from the given URL ---
      - name: Fetch + install Hailo DFC wheel (direct URL)
        env:
          WHEEL_URL: ${{ github.event.inputs.wheel_url }}
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p vendor
          # Use token header so this works for private repos too; safe for public.
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" \
               -o vendor/hailo_dfc.whl "${WHEEL_URL}"
          ls -lh vendor/hailo_dfc.whl
          python -m pip install vendor/hailo_dfc.whl

      - name: Verify Hailo SDK import/CLI
        run: |
          which hailo || echo "NOTE: 'hailo' CLI not found on PATH (some wheel builds install SDK modules only)."
          hailo --version || true
          python - <<'PY'
          import importlib
          m = importlib.import_module("hailo_sdk_client")
          print("hailo_sdk_client OK:", m.__file__)
          PY

      - name: Prepare workspace
        run: |
          mkdir -p onnx calib build

      - name: Download ONNX model
        env:
          MODEL_URL: ${{ github.event.inputs.model_url }}
        run: |
          curl -fL -o onnx/model.onnx "$MODEL_URL"
          ls -lh onnx/model.onnx

      - name: Create tiny calibration set (synthetic, fast)
        run: |
          python - <<'PY'
          import os, random, pathlib
          os.makedirs("calib", exist_ok=True)
          qs = ["genetic variant risk association","gene expression change","rsID clinical significance",
                "allele frequency population study","odds ratio disease susceptibility",
                "variant pathogenicity benign conflicting","GWAS replication meta-analysis",
                "linkage disequilibrium haplotype","case control cohort study",
                "functional annotation eQTL splicing","polygenic risk score","rare variant burden test",
                "biomarker predictive value","effect size confidence interval","imputation reference panel",
                "heritability estimate","fine-mapping credible set","transcriptomic regulation",
                "mendelian randomization causal inference"]
          ps = ["This study evaluates association between a SNP and outcomes.",
                "We report effect sizes, confidence intervals and p-values across cohorts.",
                "Functional annotation suggests impact on regulation/splicing.",
                "Allele frequencies are compared among populations.",
                "Replication and meta-analysis statistics are provided.",
                "Clinical significance uncertain with conflicting interpretations.",
                "Pathway analysis suggests immune-related enrichment.",
                "LD with nearby variants may confound signals.",
                "eQTL indicates tissue-specific effects.",
                "Further validation recommended before clinical interpretation."]
          for i in range(200):
            p = pathlib.Path(f"calib/sample_{i:04d}.txt")
            q,a,b = random.choice(qs),random.choice(ps),random.choice(ps)
            p.write_text(q+"\n"+a+"\n"+b+"\n", encoding="utf-8")
          print("Calibration folder ready.")
          PY

      # ---- DFC flow: parse -> optimize -> compile ----
      - name: Parse ONNX -> HAR
        run: |
          hailo parser onnx onnx/model.onnx --har-path build/parsed.har --hw-arch hailo8

      - name: Build numpy calibration archive
        run: |
          python - <<'PY'
          import numpy as np, os
          os.makedirs("build", exist_ok=True)
          arr = [np.random.randint(0,30000,(1,128),dtype=np.int32) for _ in range(64)]
          np.savez("build/calib_set.npz", *arr)
          print("Wrote build/calib_set.npz")
          PY

      - name: Optimize (quantize) with calibration
        run: |
          hailo optimize build/parsed.har --calib-set-path build/calib_set.npz --hw-arch hailo8 --har-path build/quantized.har

      - name: Compile HAR -> HEF
        run: |
          python - <<'PY'
          from hailo_sdk_client import ClientRunner
          r = ClientRunner(har="build/quantized.har")
          hef = r.compile()
          open("reranker.hef","wb").write(hef)
          print("HEF written: reranker.hef")
          PY

      - name: Upload HEF artifact
        uses: actions/upload-artifact@v4
        with:
          name: hailo-hef
          path: reranker.hef
