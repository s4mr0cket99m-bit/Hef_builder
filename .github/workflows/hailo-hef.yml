      - name: Fetch + install Hailo DFC wheel (direct URL)
        env:
          WHEEL_URL: ${{ github.event.inputs.wheel_url }}
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p vendor
          cd vendor
          # -J keeps the server-provided filename, -O writes to file, -L follows redirects
          curl -fL -J -O -H "Authorization: Bearer ${GH_TOKEN}" "${WHEEL_URL}"
          ls -lh
          python -m pip install ./*.whl
