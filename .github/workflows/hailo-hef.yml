name: Build Hailo HEF (MiniLM Reranker)

on:
  workflow_dispatch: {}

jobs:
  build-hef:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # onnx is used later to auto-detect input/output names if needed
          python -m pip install onnx

      - name: Prepare workspace
        run: |
          set -e
          mkdir -p onnx calib

      - name: Download ONNX model (Xenova/ms-marco-MiniLM-L-6-v2)
        run: |
          set -e
          curl -L -o onnx/model.onnx "https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/main/onnx/model.onnx?download=true"
          ls -lh onnx/model.onnx

      # --- NEW: zero-download, instant calibration set (200 tiny text files) ---
      - name: Create a tiny calibration set (no external downloads)
        run: |
          set -e
          python - <<'PY'
          import os, random
          os.makedirs("calib", exist_ok=True)
          queries = [
            "genetic variant risk association", "gene expression change", "rsID clinical significance",
            "allele frequency population study", "odds ratio disease susceptibility",
            "variant pathogenicity benign conflicting", "GWAS replication meta-analysis",
            "linkage disequilibrium haplotype", "case control cohort study",
            "functional annotation eQTL splicing", "polygenic risk score PRS", "rare variant burden test",
            "biomarker predictive value", "effect size confidence interval", "population stratification correction",
            "imputation reference panel", "heritability estimate", "fine-mapping credible set", "transcriptomic regulation",
            "mendelian randomization causal inference"
          ]
          passages = [
            "This study evaluates the association between a single nucleotide polymorphism and disease outcomes.",
            "We report effect sizes, confidence intervals and p-values across multiple cohorts.",
            "Functional annotation suggests potential impact on gene regulation and splicing.",
            "Allele frequencies are compared among populations using publicly available datasets.",
            "Results include replication in independent cohorts and meta-analysis statistics.",
            "The clinical significance is uncertain with conflicting interpretations in literature.",
            "Pathway analysis indicates enrichment in immune-related processes.",
            "Linkage disequilibrium with nearby variants may confound association signals.",
            "Expression quantitative trait loci analysis indicates tissue-specific effects.",
            "Further validation is recommended before clinical interpretation."
          ]
          for i in range(200):
            q = random.choice(queries)
            a = random.choice(passages)
            b = random.choice(passages)
            with open(f"calib/sample_{i:04d}.txt", "w") as f:
              f.write(q + "\n" + a + "\n" + b + "\n")
          print("Calibration folder ready: calib/ (200 synthetic text files)")
          PY

      - name: Write zoo.yaml (generic first attempt)
        run: |
          cat > zoo.yaml <<'YML'
          model:
            path: /w/onnx/model.onnx
          parser:
            nodes: []         # auto-infer; we’ll patch if it fails
          preprocessing:
            network_type: generic
          quantization:
            calib_set: /w/calib
            images_dir: /w/calib
          hnp:
            target: hailo8
          postprocessing:
            network_type: generic
          YML
          cat zoo.yaml

      - name: Pull Hailo Model Zoo Docker
        run: docker pull hailoai/hailo-model-zoo:latest

      - name: Quantize + Compile (attempt 1)
        id: compile1
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/w hailoai/hailo-model-zoo:latest \
            /bin/bash -lc '
              set -e
              cd /w
              echo "[1/2] Quantizing…"
              hailo_model_zoo.py quantize --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml
              echo "[2/2] Compiling…"
              hailo_model_zoo.py compile  --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml --hw-arch hailo8
              ls -1 *.hef || true
            '

      - name: If attempt 1 failed, auto-detect IO names and retry
        if: steps.compile1.outcome == 'failure'
        run: |
          set -e
          python - <<'PY'
          import onnx
          m = onnx.load("onnx/model.onnx")
          ins = [i.name for i in m.graph.input]
          outs = [o.name for o in m.graph.output]
          print("INPUTS:", ins)
          print("OUTPUTS:", outs)
          with open("zoo.yaml","w") as f:
            f.write("model:\n  path: /w/onnx/model.onnx\n")
            f.write("parser:\n  nodes:\n")
            for i in ins:
              f.write(f"    - input: {i}\n")
            for o in outs:
              f.write(f"    - output: {o}\n")
            f.write("preprocessing:\n  network_type: generic\n")
            f.write("quantization:\n  calib_set: /w/calib\n  images_dir: /w/calib\n")
            f.write("hnp:\n  target: hailo8\n")
            f.write("postprocessing:\n  network_type: generic\n")
          print("Patched zoo.yaml with explicit IO.")
          PY
          cat zoo.yaml
          docker run --rm -v "$GITHUB_WORKSPACE":/w hailoai/hailo-model-zoo:latest \
            /bin/bash -lc '
              set -e
              cd /w
              echo "[1/2] Quantizing (retry)…"
              hailo_model_zoo.py quantize --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml
              echo "[2/2] Compiling (retry)…"
              hailo_model_zoo.py compile  --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml --hw-arch hailo8
              ls -1 *.hef || true
            '

      - name: Gather HEF
        run: |
          set -e
          HEF="$(ls -1 *.hef | head -n1 || true)"
          if [ -z "$HEF" ]; then
            echo "No .hef produced. Please copy the last error lines and I’ll patch the workflow." >&2
            exit 1
          fi
          cp -v "$HEF" reranker.hef

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hailo-hef
          path: reranker.hef
