name: Build Hailo HEF (MiniLM Reranker) — from Release asset

on:
  workflow_dispatch:
    inputs:
      asset_name:
        description: "Exact filename of the Hailo DFC wheel attached to the latest Release"
        required: true
        default: "hailo_dataflow_compiler-3.33.0-py3-none-linux_x86_64.whl"
      model_url:
        description: "ONNX model URL to compile"
        required: true
        default: "https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/main/onnx/model.onnx?download=true"

jobs:
  build-hef:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnx numpy

      # Fetch your Hailo DFC wheel from the repo's latest Release
      - name: Download Hailo DFC wheel from latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ASSET_NAME: ${{ github.event.inputs.asset_name }}
        run: |
          set -e
          API="https://api.github.com/repos/$REPO/releases/latest"
          JSON="$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" "$API")"
          ASSET_URL=$(python - <<'PY'
import os, sys, json
j=json.loads(open(0).read())
name=os.environ["ASSET_NAME"]
for a in j.get("assets", []):
    if a.get("name")==name:
        print(a["url"])
        break
PY
)
          test -n "$ASSET_URL" || { echo "❌ Asset not found in latest Release: $ASSET_NAME" >&2; exit 1; }
          mkdir -p vendor
          curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/octet-stream" "$ASSET_URL" -o vendor/hailo_dfc.whl
          ls -lh vendor/hailo_dfc.whl
          python -m pip install vendor/hailo_dfc.whl

      - name: Prepare workspace
        run: |
          mkdir -p onnx calib build

      - name: Download ONNX model
        env:
          MODEL_URL: ${{ github.event.inputs.model_url }}
        run: |
          curl -L -o onnx/model.onnx "$MODEL_URL"
          ls -lh onnx/model.onnx

      # Tiny synthetic calibration (no external downloads)
      - name: Create tiny calibration set
        run: |
          python - <<'PY'
          import os, random, pathlib
          os.makedirs("calib", exist_ok=True)
          queries = [
            "genetic variant risk association","gene expression change","rsID clinical significance",
            "allele frequency population study","odds ratio disease susceptibility",
            "variant pathogenicity benign conflicting","GWAS replication meta-analysis",
            "linkage disequilibrium haplotype","case control cohort study",
            "functional annotation eQTL splicing","polygenic risk score","rare variant burden test",
            "biomarker predictive value","effect size confidence interval","population stratification correction",
            "imputation reference panel","heritability estimate","fine-mapping credible set",
            "transcriptomic regulation","mendelian randomization causal inference"
          ]
          passages = [
            "This study evaluates the association between a single nucleotide polymorphism and disease outcomes.",
            "We report effect sizes, confidence intervals and p-values across multiple cohorts.",
            "Functional annotation suggests potential impact on gene regulation and splicing.",
            "Allele frequencies are compared among populations using public datasets.",
            "Results include replication and meta-analysis statistics.",
            "Clinical significance is uncertain with conflicting interpretations.",
            "Pathway analysis indicates enrichment in immune-related processes.",
            "LD with nearby variants may confound association signals.",
            "eQTL analysis indicates tissue-specific effects.",
            "Further validation is recommended before clinical interpretation."
          ]
          for i in range(200):
            p = pathlib.Path(f"calib/sample_{i:04d}.txt")
            q,a,b = random.choice(queries),random.choice(passages),random.choice(passages)
            p.write_text(q+"\n"+a+"\n"+b+"\n", encoding="utf-8")
          print("✅ Calibration folder ready: calib/")
          PY

      # DFC flow: parse -> optimize (quantize) -> compile
      - name: Parse ONNX -> HAR
        run: |
          hailo parser onnx onnx/model.onnx --har-path build/parsed.har --hw-arch hailo8

      - name: Build numpy calibration archive
        run: |
          python - <<'PY'
          import numpy as np, os
          os.makedirs("build", exist_ok=True)
          arr = [np.random.randint(0,30000,(1,128),dtype=np.int32) for _ in range(64)]
          np.savez("build/calib_set.npz", *arr)
          print("✅ Wrote build/calib_set.npz")
          PY

      - name: Optimize (quantize) with calibration
        run: |
          hailo optimize build/parsed.har --calib-set-path build/calib_set.npz --hw-arch hailo8 --har-path build/quantized.har

      - name: Compile HAR -> HEF
        run: |
          python - <<'PY'
          from hailo_sdk_client import ClientRunner
          r = ClientRunner(har="build/quantized.har")
          hef = r.compile()
          open("reranker.hef","wb").write(hef)
          print("✅ HEF written: reranker.hef")
          PY

      - name: Upload HEF artifact
        uses: actions/upload-artifact@v4
        with:
          name: hailo-hef
          path: reranker.hef
