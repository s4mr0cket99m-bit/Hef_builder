name: Build Hailo HEF (MiniLM Reranker)

on:
  workflow_dispatch: {}

jobs:
  build-hef:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "datasets==2.*" onnx numpy

      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p onnx calib build deps

      - name: Download ONNX model (Xenova/ms-marco-MiniLM-L-6-v2)
        run: |
          set -euo pipefail
          curl -L -o onnx/model.onnx \
            "https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/main/onnx/model.onnx?download=true"
          ls -lh onnx/model.onnx

      - name: Create tiny calibration set (AG News, 200 samples)
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datasets import load_dataset
          os.makedirs("calib", exist_ok=True)
          ds = load_dataset("ag_news", split="train[:200]")
          for i, ex in enumerate(ds):
              text = ex["text"].replace("\n", " ")[:1000]
              with open(f"calib/sample_{i:04d}.txt", "w") as f:
                  f.write(text)
          print("Calibration folder ready:", len(os.listdir("calib")), "files")
          PY

      - name: Write Hailo YAML (generic)
        run: |
          set -euo pipefail
          cat > zoo.yaml <<'YML'
          model:
            path: /w/onnx/model.onnx
          parser:
            nodes: []   # auto-infer; we patch if compile fails
          preprocessing:
            network_type: generic
          quantization:
            calib_set: /w/calib
            images_dir: /w/calib
          hnp:
            target: hailo8
          postprocessing:
            network_type: generic
          YML
          cat zoo.yaml

      # ---------- Try pulling Model-Zoo Docker (Hub then GHCR, several tags) ----------
      - name: Try to pull Hailo Model Zoo images
        id: pull_try
        continue-on-error: true
        run: |
          set -euo pipefail
          TAGS="latest 2.15.0 2.14.0 2.13.0"
          IMAGES=("hailoai/hailo-model-zoo" "ghcr.io/hailo-ai/hailo-model-zoo")
          pulled=""
          for img in "${IMAGES[@]}"; do
            for tag in $TAGS; do
              echo "Attempting: docker pull ${img}:${tag}"
              if docker pull "${img}:${tag}"; then
                echo "DOCKER_IMAGE=${img}:${tag}" >> $GITHUB_ENV
                pulled="yes"
                break 2
              fi
            done
          done
          if [ -z "$pulled" ]; then
            echo "DOCKER_IMAGE=" >> $GITHUB_ENV
            echo "No public Model-Zoo image available; will try DFC wheel."
            exit 1
          fi

      - name: Quantize + Compile via Model Zoo (Docker)
        id: compile_docker
        if: env.DOCKER_IMAGE != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE":/w "${DOCKER_IMAGE}" \
            /bin/bash -lc '
              set -e
              cd /w
              echo "[1/2] Quantizing..."
              hailo_model_zoo.py quantize --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml
              echo "[2/2] Compiling..."
              hailo_model_zoo.py compile  --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml --hw-arch hailo8
              ls -1 *.hef || true
            '

      - name: Auto-detect IO names and retry (Docker path)
        if: env.DOCKER_IMAGE != '' && steps.compile_docker.outcome == 'failure'
        run: |
          set -euo pipefail
          python - <<'PY'
          import onnx
          m = onnx.load("onnx/model.onnx")
          ins  = [i.name for i in m.graph.input]
          outs = [o.name for o in m.graph.output]
          print("Inputs:", ins); print("Outputs:", outs)
          with open("zoo.yaml","w") as f:
            f.write("model:\n  path: /w/onnx/model.onnx\n")
            f.write("parser:\n  nodes:\n")
            for n in ins:  f.write(f"    - input: {n}\n")
            for n in outs: f.write(f"    - output: {n}\n")
            f.write("preprocessing:\n  network_type: generic\n")
            f.write("quantization:\n  calib_set: /w/calib\n  images_dir: /w/calib\n")
            f.write("hnp:\n  target: hailo8\n")
            f.write("postprocessing:\n  network_type: generic\n")
          PY
          cat zoo.yaml
          docker run --rm -v "$GITHUB_WORKSPACE":/w "${DOCKER_IMAGE}" \
            /bin/bash -lc '
              set -e
              cd /w
              echo "[Retry] Quantizing..."
              hailo_model_zoo.py quantize --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml
              echo "[Retry] Compiling..."
              hailo_model_zoo.py compile  --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml --hw-arch hailo8
              ls -1 *.hef || true
            '

      # ---------- If Docker not available, fetch the DFC wheel from your latest Release ----------
      - name: Download DFC wheel from latest Release (if Docker unavailable)
        if: env.DOCKER_IMAGE == ''
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_REGEX: ^hailo_dataflow_compiler-.*\.whl$
        run: |
          set -euo pipefail
          mkdir -p deps
          JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/$GH_REPO/releases/latest" || true)
          python - <<'PY'
          import os, re, json, sys
          data = json.loads(os.environ.get("JSON","{}"))
          rgx  = re.compile(os.environ.get("ASSET_REGEX","^$"))
          assets = data.get("assets", [])
          match = next((a for a in assets if rgx.match(a.get("name",""))), None)
          if not match:
            print("::error::No DFC wheel found in the latest Release assets. Attach your wheel to a Release and re-run.")
            sys.exit(2)
          # For private repos use the asset API URL + octet-stream to download bytes
          asset_id = match["id"]
          print("Found asset:", match["name"], "id:", asset_id)
          open("asset_id.txt","w").write(str(asset_id))
          PY
          ASSET_ID=$(cat asset_id.txt)
          curl -L -o deps/dfc.whl \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               "https://api.github.com/repos/$GH_REPO/releases/assets/${ASSET_ID}"
          ls -lh deps/dfc.whl

      - name: Install Hailo DFC wheel (fallback path)
        if: env.DOCKER_IMAGE == ''
        run: |
          set -euo pipefail
          python -m pip install deps/dfc.whl
          hailo --version || true

      - name: Parse ONNX → HAR (DFC CLI)
        id: parse_har
        if: env.DOCKER_IMAGE == ''
        continue-on-error: true
        run: |
          set -euo pipefail
          # IMPORTANT: do NOT pass --input-sizes (that caused your prior error)
          hailo parser onnx onnx/model.onnx --har-path build/parsed.har --hw-arch hailo8
          ls -lh build/parsed.har

      - name: Optimize (quantize) HAR (DFC CLI)
        id: optimize_har
        if: env.DOCKER_IMAGE == ''
        continue-on-error: true
        run: |
          set -euo pipefail
          hailo optimize --har build/parsed.har --calib-set calib --output-har build/optimized.har || true
          if [ -f build/optimized.har ]; then
            echo "HAR_OUT=build/optimized.har" >> $GITHUB_ENV
          else
            echo "HAR_OUT=build/parsed.har" >> $GITHUB_ENV
          fi

      - name: Compile HEF (DFC CLI)
        if: env.DOCKER_IMAGE == ''
        run: |
          set -euo pipefail
          hailo compiler --hef-path reranker.hef "${HAR_OUT}"
          ls -lh reranker.hef

      - name: Collect HEF
        run: |
          set -euo pipefail
          HEF="$(ls -1 *.hef 2>/dev/null | head -n1 || true)"
          if [ -z "$HEF" ]; then
            echo "::error::No .hef produced. Open the last ~40 lines of the Quantize/Compile step above and share them."
            exit 1
          fi
          cp -v "$HEF" reranker.hef

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hailo-hef
          path: reranker.hef
