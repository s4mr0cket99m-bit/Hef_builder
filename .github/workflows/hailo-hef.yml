name: Build Hailo HEF (MiniLM Reranker)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag that contains the DFC wheel (leave empty to use latest)"
        required: false
        default: ""
      asset_name:
        description: "Exact DFC wheel filename in that Release (e.g., hailo_dataflow_compiler-3.33.0-py3-none-linux_x86_64.whl)"
        required: false
        default: ""

jobs:
  build-hef:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==2.*" onnx numpy

      - name: Prep workspace
        run: |
          mkdir -p onnx calib build deps

      - name: Download ONNX model
        run: |
          curl -L -o onnx/model.onnx \
            "https://huggingface.co/Xenova/ms-marco-MiniLM-L-6-v2/resolve/main/onnx/model.onnx?download=true"
          ls -lh onnx/model.onnx

      - name: Create tiny calibration set (AG News, 200)
        env: { HF_HUB_DISABLE_TELEMETRY: "1" }
        run: |
          python - <<'PY'
          import os
          from datasets import load_dataset
          os.makedirs("calib", exist_ok=True)
          ds = load_dataset("ag_news", split="train[:200]")
          for i, ex in enumerate(ds):
            text = ex["text"].replace("\n"," ")[:1000]
            with open(f"calib/sample_{i:04d}.txt","w") as f:
              f.write(text)
          print("Calibration folder:", len(os.listdir("calib")), "files")
          PY

      - name: Write Hailo YAML
        run: |
          cat > zoo.yaml <<'YML'
          model:
            path: /w/onnx/model.onnx
          parser:
            nodes: []     # will infer; we patch on failure
          preprocessing:
            network_type: generic
          quantization:
            calib_set: /w/calib
            images_dir: /w/calib
          hnp:
            target: hailo8
          postprocessing:
            network_type: generic
          YML

      # Try to pull Model-Zoo Docker (some envs have access; if not, we'll use DFC wheel)
      - name: Try Model-Zoo Docker (Hub→GHCR)
        id: pull_try
        continue-on-error: true
        run: |
          set -e
          for img in hailoai/hailo-model-zoo ghcr.io/hailo-ai/hailo-model-zoo; do
            for tag in latest 2.15.0 2.14.0 2.13.0; do
              echo "docker pull $img:$tag"
              if docker pull "$img:$tag"; then
                echo "DOCKER_IMAGE=$img:$tag" >> $GITHUB_ENV
                exit 0
              fi
            done
          done
          exit 1

      - name: Quantize + Compile via Model Zoo (Docker)
        id: compile_docker
        if: steps.pull_try.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/w "$DOCKER_IMAGE" \
            /bin/bash -lc '
              set -e
              cd /w
              hailo_model_zoo.py quantize --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml
              hailo_model_zoo.py compile  --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml --hw-arch hailo8
              ls -1 *.hef || true
            '

      - name: Auto-detect IO + retry (Docker)
        if: steps.pull_try.outcome == 'success' && steps.compile_docker.outcome == 'failure'
        run: |
          python - <<'PY'
          import onnx
          m = onnx.load("onnx/model.onnx")
          ins  = [i.name for i in m.graph.input]
          outs = [o.name for o in m.graph.output]
          with open("zoo.yaml","w") as f:
            f.write("model:\n  path: /w/onnx/model.onnx\nparser:\n  nodes:\n")
            for n in ins:  f.write(f"    - input: {n}\n")
            for n in outs: f.write(f"    - output: {n}\n")
            f.write("preprocessing:\n  network_type: generic\nquantization:\n  calib_set: /w/calib\n  images_dir: /w/calib\nhnp:\n  target: hailo8\npostprocessing:\n  network_type: generic\n")
          PY
          docker run --rm -v "$GITHUB_WORKSPACE":/w "$DOCKER_IMAGE" \
            /bin/bash -lc '
              set -e
              cd /w
              hailo_model_zoo.py quantize --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml
              hailo_model_zoo.py compile  --ckpt /w/onnx/model.onnx --yaml /w/zoo.yaml --hw-arch hailo8
              ls -1 *.hef || true
            '

      # ---------- Fallback: download your DFC wheel from a Release ----------
      - name: Download DFC wheel from Release
        if: steps.pull_try.outcome == 'failure'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG:  ${{ github.event.inputs.release_tag }}
          ASSET:    ${{ github.event.inputs.asset_name }}
        run: |
          set -e
          if [ -n "$ASSET" ] && [ -n "$REL_TAG" ]; then
            echo "Fetching asset '$ASSET' from tag '$REL_TAG'..."
            JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$GH_REPO/releases/tags/$REL_TAG")
          else
            echo "Using *latest* release and regex match hailo_dataflow_compiler-*.whl ..."
            JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$GH_REPO/releases/latest")
          fi
          echo "$JSON" > release.json
          python - <<'PY'
          import json, os, re, sys
          data = json.load(open("release.json"))
          assets = data.get("assets", [])
          want = os.environ.get("ASSET","").strip()
          if want:
            match = next((a for a in assets if a.get("name","")==want), None)
          else:
            rgx = re.compile(r"^hailo_dataflow_compiler-.*\.whl$", re.I)
            match = next((a for a in assets if rgx.match(a.get("name",""))), None)
          if not match:
            print("::error::DFC wheel not found in that release. Check tag/asset name and try again.")
            print("Assets present:", [a.get("name") for a in assets])
            sys.exit(2)
          open("asset_id.txt","w").write(str(match["id"]))
          PY
          ASSET_ID=$(cat asset_id.txt)
          curl -L -o deps/dfc.whl \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               "https://api.github.com/repos/$GH_REPO/releases/assets/${ASSET_ID}"
          ls -lh deps/dfc.whl
          python -m pip install deps/dfc.whl
          hailo --version || true

      - name: Parse ONNX → HAR (DFC CLI)
        if: steps.pull_try.outcome == 'failure'
        run: |
          hailo parser onnx onnx/model.onnx --har-path build/parsed.har --hw-arch hailo8
          ls -lh build/parsed.har

      - name: Optimize (quantize) HAR (DFC CLI)
        if: steps.pull_try.outcome == 'failure'
        continue-on-error: true
        run: |
          hailo optimize --har build/parsed.har --calib-set calib --output-har build/optimized.har || true
          [ -f build/optimized.har ] && echo "HAR_OUT=build/optimized.har" >> $GITHUB_ENV || echo "HAR_OUT=build/parsed.har" >> $GITHUB_ENV

      - name: Compile HEF (DFC CLI)
        if: steps.pull_try.outcome == 'failure'
        run: |
          hailo compiler --hef-path reranker.hef "${HAR_OUT}"
          ls -lh reranker.hef

      - name: Collect HEF
        run: |
          HEF="$(ls -1 *.hef 2>/dev/null | head -n1 || true)"
          if [ -z "$HEF" ]; then
            echo "::error::No .hef produced. Open the last 40 lines of the compile step and paste them here."
            exit 1
          fi
          cp -v "$HEF" reranker.hef

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hailo-hef
          path: reranker.hef
