name: Hailo DistilGPT2 Compilation
on:
  workflow_dispatch:
jobs:
  compile_model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers onnx numpy

      - name: Download and convert DistilGPT2 to ONNX
        run: |
          python - << 'EOF'
          import torch
          from transformers import AutoModelForCausalLM
          model = AutoModelForCausalLM.from_pretrained("distilgpt2")
          model.eval()
          dummy_input = torch.randint(0, 50257, (1, 128), dtype=torch.long)
          torch.onnx.export(
              model, dummy_input, "distilgpt2.onnx",
              input_names=["input_ids"], output_names=["logits"],
              opset_version=12
          )
          EOF

      - name: Generate calibration data
        run: |
          python - << 'EOF'
          import numpy as np
          # Synthetic calibration data: shape (10, 128), values in [0, 50256]
          calib_data = np.random.randint(0, 50257, size=(10, 128), dtype=np.int32)
          np.save("calib_set.npy", calib_data)
          EOF

      - name: Install Hailo Dataflow Compiler
        run: pip install https://github.com/s4mr0cket99m-bit/Hef_builder/releases/download/dfc-1/hailo_dataflow_compiler-3.33.0-py3-none-linux_x86_64.whl

      - name: Parse ONNX model with Hailo DFC
        run: hailo parser onnx distilgpt2.onnx --net-name distilgpt2 --har-path distilgpt2.har

      - name: Optimize model with Hailo DFC
        run: hailo optimize distilgpt2.har --calib-set-path calib_set.npy --output-har-path distilgpt2_optimized.har

      - name: Compile model to HEF with Hailo DFC
        run: hailo compiler distilgpt2_optimized.har --output-dir .

      - name: Upload HEF artifact
        uses: actions/upload-artifact@v3
        with:
          name: distilgpt2-hef
          path: distilgpt2.hef
